name: ephemeral-files

x-app-image: &app-image
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: ephemeral-files-app
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  app:
    <<: *app-image
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/storage/framework/.ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ephemeral_files}
      MYSQL_USER: ${DB_USERNAME:-ephemeral_files}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping: the server's temporary init instance has networking off, so a socket ping reports alive too early
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  queue-worker:
    <<: *app-image
    command: php artisan queue:work rabbitmq --tries=3 --sleep=1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app-image
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  mysql-data:
