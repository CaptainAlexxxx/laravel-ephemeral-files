name: ephemeral-files

x-app-image: &app-image
  build:
    context: ./docker/php
  image: ephemeral-files-app
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  app:
    <<: *app-image
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/storage/framework/.ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  queue-worker:
    <<: *app-image
    command: php artisan queue:work rabbitmq --tries=3 --sleep=1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app-image
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  mysql-data:
